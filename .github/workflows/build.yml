name: 'Pine Framework Build'

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [ "**" ]

# When pushing a new commit we should cancel
# the previous run
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(vars.NODE_VERSIONS) }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/actions/build-core
        with:
          node-version: ${{ matrix.node }}

  test-lint:
    needs: [build-core]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(vars.NODE_VERSIONS) }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/actions/test-lint
        with:
          node-version: ${{ matrix.node }}

  test-specs:
    needs: [build-core]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(vars.NODE_VERSIONS) }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/actions/test-spec
        with:
          node-version: ${{ matrix.node }}

  # Not matrixed: @storybook/test-runner (and the Playwright it drives) requires
  # Node >=20, so running this on Node 18 — the lowest entry in NODE_VERSIONS —
  # fails outright ("Playwright requires Node.js 20 or higher"). The audited
  # Storybook build is static HTML/JS; its result doesn't vary by the Node
  # version that produced core's dist, so one run is correct, not a coverage cut.
  test-a11y:
    needs: [build-core]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/actions/test-a11y
        with:
          node-version: '22'

  size-check:
    needs: [build-core]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(vars.NODE_VERSIONS) }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/actions/size-check
        with:
          node-version: ${{ matrix.node }}

  api-check:
    needs: [build-core]
    runs-on: ubuntu-latest
    # The job only reads the tree to rebuild and compare the reports; it needs no write
    # scope, and it runs PR-authored build code (`npm ci` postinstall, the Stencil build).
    permissions:
      contents: read
    strategy:
      matrix:
        node: ${{ fromJSON(vars.NODE_VERSIONS) }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/actions/api-check
        with:
          node-version: ${{ matrix.node }}

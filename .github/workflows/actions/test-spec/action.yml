name: 'Test Specs'
descriptions: 'Runs specs for affected projects'

inputs:
  node-version:
    description: 'The version of node to use'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check out latest
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Node.js (pinned npm)
      uses: ./.github/workflows/actions/setup-node-with-pinned-npm
      with:
        node-version: ${{ inputs.node-version }}

    - name: Get npm cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    - name: Cache node_modules
      uses: actions/cache@v4
      id: cache-node-modules
      env:
        cache-name: cache-node-modules
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-

    - name: Install Dependencies
      if: steps.cache-node-modules.ouputs.cache-hit != true
      run: npm ci
      shell: bash

    - name: Test
      # Jest also writes its full results to a file, since Nx can cut the end of long task output.
      # The file sits in the project root: Jest doesn't create a missing folder for it.
      run: npx nx affected --target=test --parallel=3 --ci --coverage --json --outputFile=jest-results.json
      shell: bash

    - name: Show failing tests
      if: failure()
      run: node ${{ github.action_path }}/summarize-jest-results.mjs libs/core/jest-results.json
      shell: bash

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: jest-results-node-${{ inputs.node-version }}
        path: libs/*/jest-results.json
        if-no-files-found: ignore
        overwrite: true
        retention-days: 7

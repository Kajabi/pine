name: 'Set up Node.js with pinned npm'
description: 'Runs actions/setup-node then installs the npm version from package.json packageManager (or the npm-version input).'

inputs:
  node-version:
    description: 'Node.js version (omit or leave empty when using only node-version-file).'
    required: false
    default: ''
  node-version-file:
    description: 'File with Node version (e.g. .nvmrc).'
    required: false
    default: ''
  npm-version:
    description: 'npm version to install instead of the package.json packageManager pin (e.g. "11"). Leave empty to use the pin.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node.js (explicit version)
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}

    - name: Set up Node.js (version file only)
      if: ${{ inputs.node-version == '' }}
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Pin npm (package.json packageManager unless overridden)
      shell: bash
      env:
        NPM_VERSION_OVERRIDE: ${{ inputs.npm-version }}
      run: |
        if [ -n "${NPM_VERSION_OVERRIDE}" ]; then
          NPM_VERSION="${NPM_VERSION_OVERRIDE}"
          echo "Installing npm ${NPM_VERSION} (overriding the package.json pin)"
        else
          NPM_VERSION=$(node -p "require('./package.json').packageManager.replace('npm@', '')")
          echo "Pinning npm to ${NPM_VERSION}"
        fi
        for attempt in 1 2 3; do
          npm install -g "npm@${NPM_VERSION}" && break
          if [ "$attempt" -eq 3 ]; then
            echo "npm install -g failed after 3 attempts"
            exit 1
          fi
          echo "npm install -g failed (attempt ${attempt}), retrying in $((attempt * 5))s..."
          sleep $((attempt * 5))
        done
        npm --version

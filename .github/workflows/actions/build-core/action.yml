name: 'Build Core'
description: 'Builds the Core Design System library'

inputs:
  node-version:
    description: 'The version of node to use'
    default: 22

runs:
  using: 'composite'
  steps:
    - name: Check out latest
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Node.js (pinned npm)
      uses: ./.github/workflows/actions/setup-node-with-pinned-npm
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.nvmrc'

    - name: Verify NPM Cache
      shell: bash
      run: npm cache verify

    - name: Get NPM cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    - name: Cache node_modules
      uses: actions/cache@v4
      id: cache-node-modules
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-build-${{ github.sha }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-

    - name: Set SHA
      uses: nrwl/nx-set-shas@v4

    - name: Install Dependencies
      if: steps.cache-node-modules.outputs.cache-hit != true
      run: npm ci
      shell: bash

    - name: Build Core
      run: npx nx run @pine-ds/core:build
      shell: bash

    # libs/react/src is generated by @stencil/react-output-target on every build,
    # but it is also committed. If the build output no longer matches what is on the
    # branch, the committed files are stale -- e.g. someone committed by hand without
    # rebuilding first, or a @stencil/react-output-target upgrade changed its output
    # and the regenerated files were never committed.
    #
    # This check is only meaningful because the "Build Core" step above really runs:
    # libs/react/src is not a declared Nx output of @pine-ds/core:build, so a build
    # served from the Nx task cache regenerates nothing and would leave this
    # comparison vacuously green. CI persists only the npm cache (not .nx/cache), so
    # every run builds for real. If .nx/cache is ever cached or Nx Cloud is enabled,
    # this step must regenerate explicitly (e.g. append --skip-nx-cache) or it will
    # silently stop verifying anything.
    #
    # Use `git status --porcelain` rather than `git diff`: a vendor upgrade that adds
    # or removes a file under react-component-lib/ shows up as an untracked or deleted
    # path, and `git diff` reports neither.
    - name: Verify generated React bindings are in sync
      shell: bash
      run: |
        if [ -n "$(git status --porcelain -- libs/react/src)" ]; then
          echo "::error::Generated React bindings in libs/react/src are out of sync with the build output (details below)."
          git status --porcelain -- libs/react/src
          git diff -- libs/react/src
          echo "Run 'npx nx run @pine-ds/core:build --skip-nx-cache' locally and commit the result."
          echo "(--skip-nx-cache matters: a cached build regenerates nothing.)"
          exit 1
        fi
        echo "Generated React bindings are in sync."

    - name: Upload core dist for size-check
      uses: ./.github/workflows/actions/upload-archive
      with:
        name: pine-core-dist-${{ inputs.node-version }}-${{ github.sha }}
        output: core-dist.zip
        paths: libs/core/dist

name: 'Build Core'
description: 'Builds the Core Design System library'

inputs:
  node-version:
    description: 'The version of node to use'
    default: 22

runs:
  using: 'composite'
  steps:
    - name: Check out latest
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Node.js (pinned npm)
      uses: ./.github/workflows/actions/setup-node-with-pinned-npm
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.nvmrc'

    - name: Verify NPM Cache
      shell: bash
      run: npm cache verify

    - name: Get NPM cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    - name: Cache node_modules
      uses: actions/cache@v4
      id: cache-node-modules
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-build-${{ github.sha }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-

    - name: Set SHA
      uses: nrwl/nx-set-shas@v4

    - name: Install Dependencies
      if: steps.cache-node-modules.outputs.cache-hit != true
      run: npm ci
      shell: bash

    - name: Build Core
      run: npx nx run @pine-ds/core:build
      shell: bash

    # libs/react/src is generated by @stencil/react-output-target on every build,
    # but it is also committed. If the build output no longer matches what is on the
    # branch, the committed files are stale -- most often because a hand-authored
    # patch in libs/core/scripts/react-output-target-with-patches.ts was stripped by
    # a build and committed in its unpatched form.
    - name: Verify generated React bindings are in sync
      shell: bash
      run: |
        if ! git diff --exit-code -- libs/react/src; then
          echo "::error::Generated React bindings in libs/react/src are out of sync with the build output (diff above)."
          echo "Run 'npx nx run @pine-ds/core:build' locally and commit the result."
          exit 1
        fi
        echo "Generated React bindings are in sync."

    - name: Upload core dist for size-check
      uses: ./.github/workflows/actions/upload-archive
      with:
        name: pine-core-dist-${{ inputs.node-version }}-${{ github.sha }}
        output: core-dist.zip
        paths: libs/core/dist

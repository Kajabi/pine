name: 'Build Storybook'
description: 'Builds the static Storybook once so Chromatic and the accessibility gate can share one artifact'

inputs:
  node-version:
    description: >-
      The version of node to use. Must be one of vars.NODE_VERSIONS so that the
      matching build-core dist artifact resolves.
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check out latest
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Node.js (pinned npm)
      uses: ./.github/workflows/actions/setup-node-with-pinned-npm
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.nvmrc'

    - name: Get NPM cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-npm-${{ github.sha }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install Dependencies
      run: npm ci
      shell: bash

    # Storybook's preview imports libs/core/dist/docs.json, so the Stencil build
    # has to be present before Storybook can be built. Reuse build-core's
    # artifact rather than rebuilding it, as size-check does.
    - name: Download core dist from build-core
      uses: ./.github/workflows/actions/download-archive
      with:
        name: pine-core-dist-${{ inputs.node-version }}-${{ github.sha }}
        path: /tmp/pine-core-dist
        filename: core-dist.zip

    # No doc-components build here, unlike the Chromatic workflow this replaces.
    # libs/core/.storybook/main.js aliases @pine-ds/doc-components straight at
    # ../../doc-components/src, so libs/doc-components/dist is never read and
    # building it was dead work. Verified: deleting that dist and rebuilding
    # produces an identical story set.
    - name: Build Storybook
      run: npm run build.storybook --workspace=@pine-ds/core
      shell: bash

    # Consumed by the chromatic and test-a11y jobs. Transient build output, so it
    # is kept for a day rather than the repository default.
    - name: Upload Storybook static
      uses: ./.github/workflows/actions/upload-archive
      with:
        name: pine-storybook-static-${{ github.sha }}
        output: storybook-static.zip
        paths: libs/core/storybook-static
        retention-days: 1

name: "Pine Continuous Deployment"

# Restrict default permissions to read-only for security (principle of least privilege)
# Jobs that need more permissions (like release) explicitly override this
permissions:
  contents: read

on:
  ## We will uncomment this when we settle on a deployment schedule
  # schedule:
  #  - cron: '00 04 * * 1' # 4 am UTC (9 am CST) Monday

  workflow_call:
    inputs:
      preid:
        description: 'The prerelease id used when doing a prerelease. e.g prerelease, premajor, preminor, etc.'
        type: string
        default: ''

      ref:
        description: 'This could be a branch name, tag, or a SHA.'
        type: string
        default: ''

      tag:
        description: 'The tag to publish on NPM.'
        required: true
        type: string

      version:
        description: 'The type of version to release.'
        required: true
        type: string

    secrets:
      KAJABI_CI_GH_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      preid:
        type: string
        description: Which prerelease id should be used? This is only needed when a version is "prepatch", "preminor", "premajor", or "prerelease".
        default: ''
          # - ''
          # - alpha
          # - beta
          # - rc
          # - next

      ref:
        type: string
        description: The branch name, tag, or SHA to be checked out. This can also be left blank.
        default: ''

      tag:
        type: choice
        required: true
        description: Which npm tag should this be published to?
        options:
          - latest
          - next
          - dev

      version:
        type: choice
        description: Which version should be published?
        options:
          - ''
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Set SHA
        uses: nrwl/nx-set-shas@v5

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/workflows/actions/setup

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build Core
        uses: ./.github/workflows/actions/build-core

  build-react:
    runs-on: ubuntu-latest

    steps:
      - name: Set SHA
        uses: nrwl/nx-set-shas@v5

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/workflows/actions/setup

      - name: Build React
        uses: ./.github/workflows/actions/build-react


  build-doc-components:
    runs-on: ubuntu-latest

    steps:
      - name: Set SHA
        uses: nrwl/nx-set-shas@v5

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/workflows/actions/setup

      - name: Build Doc Components
        uses: ./.github/workflows/actions/build-doc-components

  release:
    permissions:
      contents: write
      id-token: write
    needs: [build-core, build-react, build-doc-components]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.KAJABI_CI_GH_TOKEN }}

      - name: Pin origin remote to PAT identity
        run: git remote set-url origin "https://x-access-token:${KAJABI_CI_GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          KAJABI_CI_GH_TOKEN: ${{ secrets.KAJABI_CI_GH_TOKEN }}

      - name: Get Latest
        run: git pull
        shell: bash

      # Trusted publishing needs npm 11.5.1 or newer. Node 22 bundles npm 10.x and
      # the repo-wide pin (package.json packageManager) stays on 10.8.2 because the
      # Node 18 legs of the CI matrix cannot run npm 11, so only this job overrides
      # it. Both write lockfile v3, so the lockfile regenerated further down is
      # still valid for the pinned npm.
      - name: Set up Node.js (pinned npm)
        uses: ./.github/workflows/actions/setup-node-with-pinned-npm
        with:
          node-version-file: '.nvmrc'
          npm-version: '11'

      - name: Verify NPM Cache
        shell: bash
        run: npm cache verify

      - name: Get NPM cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> $GITHUB_ENV

      - name: Configure user
        run: |
          git config user.name "DSS Automation Bot"
          git config user.email "dev+github-bot@kajabi.com"
        shell: bash

      # - name: Restore Core built Cache
      #   uses: ./.github/workflows/actions/download-archive
      #   with:
      #     name: pine-core
      #     path: libs/core
      #     filename: CoreBuild.zip

      # - name: Restore React built Cache
      #   uses: ./.github/workflows/actions/download-archive
      #   with:
      #     name: pine-react
      #     path: libs/react
      #     filename: ReactBuild.zip

      # - name: Restore Doc Components built cache
      #   uses: ./.github/workflows/actions/download-archive
      #   with:
      #     name: pine-doc-components
      #     path: libs/doc-components
      #     filename: DocComponentsBuild.zip

      - name: Install Dependencies
        run: npm ci --ignore-scripts
        shell: bash

      - name: Build All
        run: npx nx run-many --target=build --all
        shell: bash

      # npm authenticates this job with a short-lived OIDC token exchanged for the
      # Trusted Publisher configured on each @pine-ds package (PE-2432); there is
      # no NPM_TOKEN secret to expire or rotate. Fail here, before `nx release`
      # versions, commits or tags anything, if the job cannot mint that token or
      # npm is too old to use it.
      - name: Verify npm trusted publishing prerequisites
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in this job. Trusted publishing needs 'id-token: write' on this job and on the job of any workflow that calls this one."
            exit 1
          fi
          NPM_VERSION=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_VERSION} is too old for trusted publishing (needs 11.5.1 or newer)."
            exit 1
          fi
          echo "OIDC token endpoint available; npm ${NPM_VERSION}"

      - name: Release
        if: ${{ inputs.version == '' }}
        run: npx nx release --skip-publish
        env:
          GH_TOKEN: ${{ secrets.KAJABI_CI_GH_TOKEN }}

      ### Steps below are used for releasing a specified version type (major, minor, patch, etc.)
      - name: Release with Input Version
        if: ${{ inputs.version != '' }}
        run: npx nx release ${{ inputs.version }} --preid ${{ inputs.preid }} --skip-publish
        env:
          GH_TOKEN: ${{ secrets.KAJABI_CI_GH_TOKEN }}

      # Publishing is its own step so its exit code counts. The release steps
      # above run `nx release --skip-publish`, which versions and writes the
      # changelog (committing locally) but does not publish. Top-level `nx release`
      # would publish itself and discard the result, which is how 3.31.0 was tagged
      # and released on GitHub on 2026-09-21 without ever reaching npm; and a
      # second publish run after it raced the registry, which lists an accepted
      # publish only after several minutes and answers any retry in that window
      # with "409 Cannot publish over previously staged version" (npm/cli#9889).
      # `nx release publish` skips versions already on the registry and returns
      # non-zero when an upload fails, so it also heals a version stranded by an
      # earlier run and fails the job, before anything is pushed, when npm rejects
      # an upload. On a rerun, a 409 "previously staged" means the registry already
      # holds the version, so it is logged and the verify step below waits for it.
      # Ported from pine-icons; see DSS-215.
      - name: Publish to npm
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -uo pipefail
          npx nx release publish 2>&1 | tee "$RUNNER_TEMP/nx-release-publish.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] && grep -q "Cannot publish over previously staged version" "$RUNNER_TEMP/nx-release-publish.log"; then
            echo "::warning::npm already holds this version from an earlier publish and is still processing it (npm/cli#9889). Not retrying; the next step waits for it to appear."
            exit 0
          fi
          exit "$STATUS"

      # Confirm every package at the released version is queryable on npm. The
      # window is generous because the registry can take several minutes to list
      # an accepted publish. A version that never appears has most likely wedged
      # in npm's internal staged state (npm/cli#9889); that number is burnt.
      # Because this job stops here, before the finalize step, git will not have
      # the version either, and the next release would compute the same number
      # and hit the same 409: bump past it with a normal commit before releasing.
      - name: Verify npm publish landed
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          for PKG_JSON in libs/*/package.json; do
            SPEC="$(node -p "require('./${PKG_JSON}').name")@$(node -p "require('./${PKG_JSON}').version")"
            FOUND=0
            for attempt in $(seq 1 60); do
              if npm view "${SPEC}" version >/dev/null 2>&1; then
                echo "✓ ${SPEC} confirmed on npm"
                FOUND=1
                break
              fi
              echo "  ${SPEC} not visible yet (attempt ${attempt}/60), waiting 10s…"
              sleep 10
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::${SPEC} is not on npm after 10 minutes. If the publish step reported '409 previously staged', npm accepted it but never finished processing it (npm/cli#9889) and the number is burnt: bump past it before releasing again. Otherwise check the nx-release-publish output above and the package's Trusted Publisher settings on npmjs.com."
              FAILED=1
            fi
          done
          exit "$FAILED"

      # nx release commits locally but does not push (createRelease: false). We
      # regenerate the lockfile with the same npm CI uses, amend it into the
      # release commit, fix the commit message, verify npm ci, then push once.
      - name: Finalize release commit, push, and create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KAJABI_CI_GH_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --rebase --autostash origin main

          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Release did not create a new commit; nothing to finalize."
            exit 0
          fi

          VERSION=$(node -p "require('./libs/core/package.json').version")
          TAG="v${VERSION}"
          COMMIT_MSG="chore(release): release ${VERSION}"

          rm -rf node_modules
          npm install --ignore-scripts

          NEEDS_AMEND=false
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            NEEDS_AMEND=true
          fi
          if [[ "$(git log -1 --format=%s)" != "$COMMIT_MSG" ]]; then
            NEEDS_AMEND=true
          fi
          if [[ "$NEEDS_AMEND" == "true" ]]; then
            git commit --amend -m "$COMMIT_MSG"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG"
            TAG_FORCE_PUSH=true
          else
            git tag "$TAG"
            TAG_FORCE_PUSH=false
          fi

          rm -rf node_modules
          if ! npm ci --ignore-scripts; then
            echo "::error::Lockfile still fails npm ci after regeneration."
            exit 1
          fi

          git push origin HEAD:main
          if [[ "$TAG_FORCE_PUSH" == "true" ]]; then
            git push origin "$TAG" --force
          else
            git push origin "$TAG"
          fi

          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          awk -v ver="$VERSION" '/^## / { if (found) exit; if ($2 == ver) found=1; next } found { print }' CHANGELOG.md > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ -s "$NOTES_FILE" ]]; then
              gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
            else
              echo "::warning::No changelog section found for ${VERSION}; leaving existing release notes."
            fi
          elif [[ -s "$NOTES_FILE" ]]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            echo "::warning::No changelog section found for ${VERSION}; using generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  send-slack-notification:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest
        run: git pull
        shell: bash

      - name: Fetch latest tags
        run: git fetch --tags
        shell: bash

      - name: Setup ENV Vars
        run: |
          # Get the latest git tag (which is the version just released)
          VERSION=$(git describe --tags --abbrev=0)
          CURRENT_DATE=$(date +'%B %d, %Y')

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_ENV
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v3.0.3
        env:
          DATE: ${{ env.CURRENT_DATE }}
          RELEASE_URL: ${{ env.RELEASE_URL }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_NAME }}
          VERSION: ${{ env.VERSION }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: "./.github/workflows/slack_payloads/release-info.json"
          payload-templated: true
